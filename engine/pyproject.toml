[project]
name = "bobinestyle"
version = "1.1.1"
description = "Applique le style maison aux sous-titres français d'un MKV et le remuxe (suite Bobine)"
readme = "README.md"
authors = [
    { name = "Marc Valat", email = "marc.valat@hotmail.fr" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
    "fastapi>=0.115.0",
    "imageio-ffmpeg>=0.6.0",
    "pillow>=11",
    "uvicorn>=0.32.0",
    "websockets>=13.0",
]

[project.scripts]
bobinestyle = "bobinestyle.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pyinstaller>=6.22.3",
    "pyinstaller-hooks-contrib>=2026.7",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
